name: Runtime tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the deployed Python version
        id: runtime
        shell: bash
        run: |
          version=$(sed -nE 's/^FROM python:([0-9]+\.[0-9]+)-slim@sha256:[0-9a-f]{64}$/\1/p' Dockerfile)
          [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]
          echo "python=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.runtime.outputs.python }}
      - name: Install and check the shipped package
        run: |
          python -m pip install --only-binary=pydantic-core --no-deps -r requirements-lock.txt
          python -m pip install --no-deps .
          python -m pip check
          arbling-telegram-mcp --help
      - name: Run the existing tests against the pinned dependencies
        run: |
          python -m pip install -c requirements-lock.txt 'pytest>=7.0' 'pytest-asyncio>=0.23'
          python -m pytest -q
